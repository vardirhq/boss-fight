name: boss-kamp-api

services:
  boss-kamp-api:
    image: ${BOSS_KAMP_API_IMAGE:?Set BOSS_KAMP_API_IMAGE to an immutable image digest}
    command: ["node", "dist/index.js"]
    network_mode: host
    env_file: .env.production
    environment:
      CORS_ORIGIN: https://boss-kamp.vardir.no,http://localhost,https://localhost,capacitor://localhost
      TRUST_PROXY: "true"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
