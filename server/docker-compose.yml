name: boss-kamp-api

services:
  boss-kamp-api:
    image: ${BOSS_KAMP_API_IMAGE:?Set BOSS_KAMP_API_IMAGE to an immutable image digest}
    network_mode: host
    env_file: .env.production
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
