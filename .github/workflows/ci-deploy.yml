name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install PWA dependencies
        run: npm ci

      - name: Build PWA
        run: npm run build

      - name: Test PWA game and sync logic
        run: npm test

      - name: Check release metadata
        run: npm run release:check

      - name: Test release tooling
        run: npm run release:test

      - name: Audit PWA dependencies
        run: npm audit --audit-level=critical

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Test server sync contract
        working-directory: server
        run: npm test

      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: boss-kamp-production
      cancel-in-progress: false
    steps:
      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BOSS_KAMP_DEPLOY_SSH_KEY }}" > ~/.ssh/boss_kamp_deploy
          chmod 600 ~/.ssh/boss_kamp_deploy
          ssh-keyscan -H "${{ secrets.BOSS_KAMP_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/boss_kamp_deploy \
            "${{ secrets.BOSS_KAMP_DEPLOY_USER }}@${{ secrets.BOSS_KAMP_DEPLOY_HOST }}" \
            'set -euo pipefail
             cd /opt/boss-fight
             git fetch origin main
             git reset --hard origin/main
             cd server
             docker compose build
             set -a
             . ./.env.production
             set +a
             install -d -m 700 /opt/boss-fight/backups
             pg_dump --format=custom --file="/opt/boss-fight/backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ).dump" "$DATABASE_URL"
             docker compose run --rm boss-kamp-api npm run migrate
             docker compose up -d --no-build
             for attempt in $(seq 1 30); do
               if curl -fsS http://127.0.0.1:3002/health; then
                 exit 0
               fi
               sleep 1
             done
             docker compose ps
             docker compose logs --tail=80 boss-kamp-api
             exit 1'
