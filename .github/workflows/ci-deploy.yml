name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: boss-kamp-production
  cancel-in-progress: false

jobs:
  checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install PWA dependencies
        run: npm ci

      - name: Build PWA
        run: npm run build

      - name: Audit PWA dependencies
        run: npm audit --audit-level=critical

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BOSS_KAMP_DEPLOY_SSH_KEY }}" > ~/.ssh/boss_kamp_deploy
          chmod 600 ~/.ssh/boss_kamp_deploy
          ssh-keyscan -H "${{ secrets.BOSS_KAMP_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/boss_kamp_deploy \
            "${{ secrets.BOSS_KAMP_DEPLOY_USER }}@${{ secrets.BOSS_KAMP_DEPLOY_HOST }}" \
            'set -euo pipefail
             cd /opt/boss-fight
             git fetch origin main
             git reset --hard origin/main
             cd server
             docker compose up -d --build
             curl -fsS http://127.0.0.1:3002/health'
