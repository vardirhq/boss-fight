name: Android debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'deploid.config.mjs'
      - 'capacitor.config.json'
      - '.github/workflows/android-debug.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'deploid.config.mjs'
      - 'capacitor.config.json'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install icon tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick

      - name: Restore PNG icon source
        shell: bash
        run: |
          base64 --decode public/icons/icon-source.jpg.b64 > public/icons/icon-source.jpg
          convert public/icons/icon-source.jpg -resize '1024x1024^' -gravity center -extent 1024x1024 public/icons/icon-source.png
          file public/icons/icon-source.png | grep -q 'PNG image data'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install web dependencies
        run: npm ci

      - name: Package Android app with Deploid
        run: ./node_modules/.bin/deploid package

      - name: Verify launcher assets were generated
        shell: bash
        run: |
          if ! find android/app/src/main/res -type f \( -name 'ic_launcher*.png' -o -name 'ic_launcher*.webp' \) | grep -q .; then
            echo 'Deploid did not generate Android launcher icons'
            find android/app/src/main/res -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Configure Android system bars
        shell: bash
        run: |
          MAIN_ACTIVITY="$(find android/app/src/main/java -name MainActivity.java | head -n 1)"
          if [[ -z "$MAIN_ACTIVITY" ]]; then
            echo "Could not find generated MainActivity.java"
            exit 1
          fi

          PACKAGE_NAME="$(sed -n 's/^package \(.*\);/\1/p' "$MAIN_ACTIVITY" | head -n 1)"
          if [[ -z "$PACKAGE_NAME" ]]; then
            echo "Could not determine Android package name"
            exit 1
          fi

          cat > "$MAIN_ACTIVITY" <<EOF
          package $PACKAGE_NAME;

          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  configureSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      configureSystemBars();
                  }
              }

              private void configureSystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), true);

                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (controller == null) return;

                  controller.show(WindowInsetsCompat.Type.statusBars());
                  controller.hide(WindowInsetsCompat.Type.navigationBars());
                  controller.setSystemBarsBehavior(
                      WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  );
              }
          }
          EOF

      - name: Normalize generated Kotlin dependencies
        shell: bash
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: Build debug APK with Deploid
        run: ./node_modules/.bin/deploid build

      - name: Locate debug APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find android/app/build/outputs/apk -type f -name '*debug*.apk' | head -n 1)"
          if [[ -z "$APK_PATH" ]]; then
            echo "No debug APK was produced"
            find android/app/build/outputs -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" boss-kamp-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boss-kamp-debug-apk
          path: boss-kamp-debug.apk
          if-no-files-found: error
          retention-days: 14
