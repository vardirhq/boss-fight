name: Android debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'deploid.config.ts'
      - '.github/workflows/android-debug.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'deploid.config.ts'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci

      - name: Install Deploid and Capacitor
        run: |
          npm install --global @deploid/cli
          npm install --no-save @capacitor/cli @capacitor/core @capacitor/android

      - name: Package Android app with Deploid
        run: deploid package

      - name: Build debug APK with Deploid
        run: deploid build

      - name: Locate debug APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find android/app/build/outputs/apk -type f -name '*debug*.apk' | head -n 1)"
          if [[ -z "$APK_PATH" ]]; then
            echo "No debug APK was produced"
            find android/app/build/outputs -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" boss-kamp-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: boss-kamp-debug-apk
          path: boss-kamp-debug.apk
          if-no-files-found: error
          retention-days: 14
