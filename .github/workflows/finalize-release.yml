name: Finalize release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Number of an already-merged release pull request, for example 89. Use this to finalize a release whose merge event never reached Actions.'
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  finalize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve release pull request
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request || github.event.pull_request.number }}
        shell: bash
        run: |
          FIELDS="$(gh pr view "$PR_NUMBER" \
            --json merged,mergeCommit,headRefName,baseRefName,isCrossRepository)"

          MERGED="$(jq -r '.merged' <<<"$FIELDS")"
          MERGE_COMMIT="$(jq -r '.mergeCommit.oid // ""' <<<"$FIELDS")"
          HEAD_BRANCH="$(jq -r '.headRefName' <<<"$FIELDS")"
          BASE_BRANCH="$(jq -r '.baseRefName' <<<"$FIELDS")"
          CROSS_REPOSITORY="$(jq -r '.isCrossRepository' <<<"$FIELDS")"

          if [[ "$MERGED" != "true" ]]; then
            echo "Pull request #$PR_NUMBER is not merged"
            exit 1
          fi

          if [[ "$CROSS_REPOSITORY" != "false" ]]; then
            echo "Pull request #$PR_NUMBER comes from a fork"
            exit 1
          fi

          if [[ "$BASE_BRANCH" != "main" ]]; then
            echo "Pull request #$PR_NUMBER targets $BASE_BRANCH, not main"
            exit 1
          fi

          if [[ "$HEAD_BRANCH" != release/v* ]]; then
            echo "Pull request #$PR_NUMBER is not a release branch, got $HEAD_BRANCH"
            exit 1
          fi

          if [[ -z "$MERGE_COMMIT" ]]; then
            echo "Pull request #$PR_NUMBER has no merge commit"
            exit 1
          fi

          echo "head_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "merge_commit=$MERGE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.pull_request.outputs.merge_commit }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve and validate release
        id: release
        env:
          HEAD_BRANCH: ${{ steps.pull_request.outputs.head_branch }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          EXPECTED_BRANCH="release/$TAG"

          if [[ "$HEAD_BRANCH" != "$EXPECTED_BRANCH" ]]; then
            echo "Release branch $HEAD_BRANCH does not match package version $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          RELEASE_TAG="$TAG" npm run release:check
          npm run release:test

      - name: Create release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.pull_request.outputs.merge_commit }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"

            if [[ "$TAG_COMMIT" != "$RELEASE_COMMIT" ]]; then
              echo "$TAG already exists on $TAG_COMMIT, expected $RELEASE_COMMIT"
              exit 1
            fi
          else
            git tag --annotate "$TAG" --message "Boss Kamp $TAG" "$RELEASE_COMMIT"
            git push origin "$TAG"
          fi

      - name: Start signed Android release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh workflow run android-release.yml \
            --ref "$TAG" \
            --field release_tag="$TAG" \
            --field prerelease=false
