name: Android signed release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v1.0.0. Must match package.json version.'
        required: false
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "Release build must run from tag $RELEASE_TAG, not $GITHUB_REF"
            exit 1
          fi
          npm run release:check
          npm run release:notes > release-notes.md
          node scripts/release-metadata.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Install icon tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick

      - name: Restore PNG icon source
        shell: bash
        run: |
          base64 --decode public/icons/icon-source.jpg.b64 > public/icons/icon-source.jpg
          convert public/icons/icon-source.jpg -resize '1024x1024^' -gravity center -extent 1024x1024 public/icons/icon-source.png
          file public/icons/icon-source.png | grep -q 'PNG image data'

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Restore Android signing keystore
        shell: bash
        run: |
          install -m 700 -d secrets
          printf '%s' "${{ secrets.BOSS_KAMP_ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > secrets/boss-kamp-upload.jks
          chmod 600 secrets/boss-kamp-upload.jks
          test -s secrets/boss-kamp-upload.jks

      - name: Install web dependencies
        run: npm ci

      - name: Package Android app with Deploid
        env:
          DEPLOID_ANDROID_STORE_PASSWORD: ${{ secrets.DEPLOID_ANDROID_STORE_PASSWORD }}
          DEPLOID_ANDROID_KEY_PASSWORD: ${{ secrets.DEPLOID_ANDROID_KEY_PASSWORD }}
        run: ./node_modules/.bin/deploid package

      - name: Configure Android system bars
        shell: bash
        run: |
          MAIN_ACTIVITY="$(find android/app/src/main/java -name MainActivity.java | head -n 1)"
          if [[ -z "$MAIN_ACTIVITY" ]]; then
            echo "Could not find generated MainActivity.java"
            exit 1
          fi

          PACKAGE_NAME="$(sed -n 's/^package \(.*\);/\1/p' "$MAIN_ACTIVITY" | head -n 1)"
          if [[ -z "$PACKAGE_NAME" ]]; then
            echo "Could not determine Android package name"
            exit 1
          fi

          cat > "$MAIN_ACTIVITY" <<EOF
          package $PACKAGE_NAME;

          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  configureSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      configureSystemBars();
                  }
              }

              private void configureSystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), true);

                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (controller == null) return;

                  controller.show(WindowInsetsCompat.Type.statusBars());
                  controller.hide(WindowInsetsCompat.Type.navigationBars());
                  controller.setSystemBarsBehavior(
                      WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  );
              }
          }
          EOF

      - name: Normalize generated Kotlin dependencies
        shell: bash
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: Configure Gradle release signing
        shell: bash
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile rootProject.file('../secrets/boss-kamp-upload.jks')
                      storePassword System.getenv('DEPLOID_ANDROID_STORE_PASSWORD')
                      keyAlias 'boss-kamp'
                      keyPassword System.getenv('DEPLOID_ANDROID_KEY_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release bundle with Deploid
        env:
          DEPLOID_ANDROID_STORE_PASSWORD: ${{ secrets.DEPLOID_ANDROID_STORE_PASSWORD }}
          DEPLOID_ANDROID_KEY_PASSWORD: ${{ secrets.DEPLOID_ANDROID_KEY_PASSWORD }}
        run: ./node_modules/.bin/deploid build

      - name: Build signed release APK with Gradle
        working-directory: android
        env:
          DEPLOID_ANDROID_STORE_PASSWORD: ${{ secrets.DEPLOID_ANDROID_STORE_PASSWORD }}
          DEPLOID_ANDROID_KEY_PASSWORD: ${{ secrets.DEPLOID_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Locate signed release artifacts
        id: artifacts
        shell: bash
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"

          if [[ ! -f "$APK_PATH" ]]; then
            echo "No signed release APK was produced"
            find android/app/build/outputs -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi

          if [[ ! -f "$AAB_PATH" ]]; then
            echo "No signed release AAB was produced"
            find android/app/build/outputs -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi

          cp "$APK_PATH" boss-kamp-release.apk
          cp "$AAB_PATH" boss-kamp-release.aab
          echo "apk=boss-kamp-release.apk" >> "$GITHUB_OUTPUT"
          echo "aab=boss-kamp-release.aab" >> "$GITHUB_OUTPUT"

      - name: Verify release signatures
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "Could not find apksigner"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs boss-kamp-release.apk

          AAB_VERIFY_LOG="$(mktemp)"
          jarsigner -verify -verbose -certs boss-kamp-release.aab | tee "$AAB_VERIFY_LOG"
          if ! grep -q '^jar verified' "$AAB_VERIFY_LOG"; then
            echo "The release AAB does not contain a valid signature"
            exit 1
          fi

      - name: Upload signed release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boss-kamp-release-apk
          path: boss-kamp-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boss-kamp-release-aab
          path: boss-kamp-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Boss Kamp $VERSION" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" \
              boss-kamp-release.apk \
              boss-kamp-release.aab \
              --clobber
          else
            PRERELEASE_FLAG=()
            if [[ "$PRERELEASE" == "true" ]]; then
              PRERELEASE_FLAG=(--prerelease)
            fi

            gh release create "$RELEASE_TAG" \
              boss-kamp-release.apk \
              boss-kamp-release.aab \
              --target "$GITHUB_SHA" \
              --title "Boss Kamp $VERSION" \
              --notes-file release-notes.md \
              "${PRERELEASE_FLAG[@]}"
          fi
