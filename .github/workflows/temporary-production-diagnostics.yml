name: Temporary production error capture

on:
  push:
    branches: [agent/diagnose-configuration-sync]

jobs:
  capture:
    name: Capture filtered API errors
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BOSS_KAMP_DEPLOY_SSH_KEY }}" > ~/.ssh/boss_kamp_deploy
          chmod 600 ~/.ssh/boss_kamp_deploy
          ssh-keyscan -H "${{ secrets.BOSS_KAMP_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Watch API errors for two minutes
        run: |
          ssh -i ~/.ssh/boss_kamp_deploy \
            "${{ secrets.BOSS_KAMP_DEPLOY_USER }}@${{ secrets.BOSS_KAMP_DEPLOY_HOST }}" \
            'set -euo pipefail
             cd /opt/boss-fight/server
             for attempt in $(seq 1 24); do
               docker compose logs --since=6s --no-color boss-kamp-api 2>&1 |
                 grep -E "Unhandled API error|PostgresError|TypeError|Error:|code:" || true
               sleep 5
             done'
